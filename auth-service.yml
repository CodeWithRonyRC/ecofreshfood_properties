# Configuración de la Base de Datos (Ajusta a tus credenciales locales)
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecofreshfood_auth_db
    username: root
    password: "12345"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# Registro en Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Propiedades personalizadas para tu lógica de JWT (Las leerás en tu código)
jwt:
  secret: "TuClaveSecretaSuperSeguraYMuyLargaParaFirmarLosTokensJWT1234567890"
  expiration: 3600000 # Tiempo de vida del token en milisegundos (Ej: 1 hora)
